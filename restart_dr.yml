vault-restart-dr:
  stage: vault-restart-dr
  image: amazon/aws-cli:2.15.57

  variables:
    AWS_REGION: "us-east-1"
    VAULT_TAG_NAME: "vaas-dev-dr"
    BASTION_INSTANCE_ID: "i-076259481ae826b71"
    SSH_KEY_PATH_ON_BASTION: "/usr/bin/vaas-dev-dr/vault-dev-dr-ssh-key.pem"
    SSH_USER: "ubuntu"
    STAGE_ROLE_ARN: "arn:aws:iam::792014834907:role/gitlab-vaas-iac-role"
    KUBERNETES_POD_LABELS_INTERNET_ALLOW: "internet=allow"

  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.corp.zscaler.com

  before_script:
    - set -euo pipefail
    - yum -y install bash coreutils jq >/dev/null 2>&1 || true
    - aws --version

  script:
    - |
      echo "=== [DR-RESTART] Assuming role via OIDC ==="

      aws_sts_output="$(aws sts assume-role-with-web-identity \
        --role-arn "${STAGE_ROLE_ARN}" \
        --role-session-name "GitLabRunner-${CI_PROJECT_ID}-${CI_PIPELINE_ID}-DR-RESTART" \
        --web-identity-token "${GITLAB_OIDC_TOKEN}" \
        --duration-seconds 3600 \
        --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
        --output text)"

      export AWS_ACCESS_KEY_ID="$(echo "$aws_sts_output" | awk '{print $1}')"
      export AWS_SECRET_ACCESS_KEY="$(echo "$aws_sts_output" | awk '{print $2}')"
      export AWS_SESSION_TOKEN="$(echo "$aws_sts_output" | awk '{print $3}')"

      aws sts get-caller-identity

    - |
      echo "=== [DR-RESTART] Discovering all running Vault nodes in us-east-1 ==="

      VAULT_NODE_IPS="$(
        aws ec2 describe-instances \
          --region "${AWS_REGION}" \
          --filters \
            "Name=tag:Name,Values=${VAULT_TAG_NAME}" \
            "Name=instance-state-name,Values=running" \
          --query 'Reservations[].Instances[].PrivateIpAddress' \
          --output text | tr '\t' '\n' | sed '/^$/d'
      )"

      if [ -z "${VAULT_NODE_IPS}" ]; then
        echo "No running Vault instances found for tag ${VAULT_TAG_NAME} in ${AWS_REGION}"
        exit 1
      fi

      echo "Vault nodes found:"
      echo "${VAULT_NODE_IPS}"

      VAULT_NODE_IPS_CSV="$(echo "${VAULT_NODE_IPS}" | paste -sd, -)"
      echo "CSV list: ${VAULT_NODE_IPS_CSV}"

    - |
      echo "=== [DR-RESTART] Sending SSM command to us-east-1 bastion ==="

      CMD_ID=$(aws ssm send-command \
        --region "$AWS_REGION" \
        --instance-ids "$BASTION_INSTANCE_ID" \
        --document-name "AWS-RunShellScript" \
        --parameters commands="[
          \"set -euo pipefail\",
          \"echo Running on bastion: \$(hostname)\",
          \"mkdir -p /root/.ssh\",
          \"IPS=\\\"$VAULT_NODE_IPS_CSV\\\"\",
          \"IFS=, read -r -a NODE_ARRAY <<< \\\"\$IPS\\\"\",
          \"for NODE_IP in \\\"\${NODE_ARRAY[@]}\\\"; do\",
          \"  echo ===== Restarting Vault on \$NODE_IP =====\",
          \"  ssh-keygen -R \$NODE_IP >/dev/null 2>&1 || true\",
          \"  ssh-keyscan -H \$NODE_IP >> /root/.ssh/known_hosts 2>/dev/null || true\",
          \"  ssh -i $SSH_KEY_PATH_ON_BASTION -o StrictHostKeyChecking=no $SSH_USER@\$NODE_IP 'sudo systemctl restart vault'\",
          \"  echo Waiting 5 seconds after restart on \$NODE_IP\",
          \"  sleep 5\",
          \"  ssh -i $SSH_KEY_PATH_ON_BASTION -o StrictHostKeyChecking=no $SSH_USER@\$NODE_IP 'sudo systemctl status vault --no-pager -l | head -n 20'\",
          \"done\",
          \"echo Vault restart completed on all us-east-1 nodes\"
        ]" \
        --query "Command.CommandId" \
        --output text)

      echo "SSM Command ID: $CMD_ID"

    - |
      echo "=== [DR-RESTART] Waiting for SSM execution ==="

      STATUS=""

      for i in $(seq 1 60); do
        STATUS=$(aws ssm get-command-invocation \
          --region "$AWS_REGION" \
          --command-id "$CMD_ID" \
          --instance-id "$BASTION_INSTANCE_ID" \
          --query Status \
          --output text 2>/dev/null || true)

        echo "Poll $i: Status=$STATUS"

        if [[ "$STATUS" == "Success" || "$STATUS" == "Failed" || "$STATUS" == "Cancelled" || "$STATUS" == "TimedOut" ]]; then
          break
        fi

        sleep 10
      done

      echo "=== [DR-RESTART] StandardOutput ==="
      aws ssm get-command-invocation \
        --region "$AWS_REGION" \
        --command-id "$CMD_ID" \
        --instance-id "$BASTION_INSTANCE_ID" \
        --query StandardOutputContent \
        --output text || true

      echo "=== [DR-RESTART] StandardError ==="
      aws ssm get-command-invocation \
        --region "$AWS_REGION" \
        --command-id "$CMD_ID" \
        --instance-id "$BASTION_INSTANCE_ID" \
        --query StandardErrorContent \
        --output text || true

      if [ "$STATUS" != "Success" ]; then
        echo "SSM execution failed with status: $STATUS"
        exit 1
      fi

  needs:
    - enable-dr-replication

  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'