          -o UserKnownHostsFile=/dev/null \
          ${SSH_USER}@${ip} \
          \"sudo -i bash -lc 'export VAULT_ADDR=${VAULT_ADDR_LOCAL}; export VAULT_CACERT=${VAULT_CACERT_PATH}; vault status'\""
      }

      echo "Checking nodes to find leader (HA Mode: active)..."
      LEADER_IP=""
      for ip in ${VAULT_NODE_IPS}; do
        echo "---- Trying ${ip} ----"
        OUT="$(run_status "${ip}" 2>&1 || true)"
        echo "${OUT}"

        if echo "${OUT}" | grep -qiE '^HA Mode[[:space:]]+active$'; then
          LEADER_IP="${ip}"
          break
        fi
      done

      if [ -z "${LEADER_IP}" ]; then
        echo "ERROR: Could not find leader (no node returned 'HA Mode active')."
        exit 2
      fi

      echo "=== LEADER FOUND: ${LEADER_IP} ==="
      echo "=== Running final leader status ==="
      run_status "${LEADER_IP}"
EOS

      perl -0777 -i -pe "s|__VAULT_NODE_IPS__|${DR_NODE_IPS}|g;
                         s|__SSH_KEY__|${DR_SSH_KEY_PATH_ON_BASTION}|g;
                         s|__SSH_USER__|${DR_VAULT_SSH_USER}|g;
                         s|__VAULT_ADDR_LOCAL__|${VAULT_ADDR_LOCAL}|g;
                         s|__VAULT_CACERT_PATH__|${VAULT_CACERT_PATH}|g;" run_on_bastion_dr.sh

      echo "=== [DR] Base64 encode script and send via SSM ==="
      B64="$(base64 -w 0 run_on_bastion_dr.sh)"
      SSM_CMD="echo '${B64}' | base64 -d > /tmp/run_on_bastion_dr.sh && chmod +x /tmp/run_on_bastion_dr.sh && /tmp/run_on_bastion_dr.sh"

      PARAMS="$(jq -nc --arg cmd "${SSM_CMD}" '{commands:[$cmd]}')"

      CMD_ID="$(aws ssm send-command \
        --region "${DR_REGION}" \
        --instance-ids "${DR_BASTION_INSTANCE_ID}" \
        --document-name "AWS-RunShellScript" \
        --parameters "${PARAMS}" \
        --query "Command.CommandId" \
