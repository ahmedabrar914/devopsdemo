  image: amazon/aws-cli:2.15.57
  tags:
    - sqrunners-k8s
  variables:
    KUBERNETES_POD_LABELS_INTERNET_ALLOW: "internet-allow"
    # This avoids your "sts.us-east-1.amazonaws.com timeout" by using global STS endpoint behavior
    AWS_STS_REGIONAL_ENDPOINTS: "legacy"
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: "https://gitlab.corp.zscaler.com"
  script:
    - set -euo pipefail
    - yum -y install jq openssh-clients coreutils perl >/dev/null 2>&1 || true
