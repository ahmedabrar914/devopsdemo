workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "api"'
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - when: never

stages:
  - status

variables:
  STAGE_ROLE_ARN: "arn:aws:iam::792014834907:role/gitlab-vaas-iac-role"
  KUBERNETES_POD_LABELS_INTERNET_ALLOW: "internet=allow"

vault-leader-status:
  stage: status
  image: amazon/aws-cli:2.15.57

  parallel:
    matrix:
      - TARGET: "PRIMARY"
        AWS_REGION: "us-west-2"
        VAULT_TAG_NAME: "vaas-staging"
        BASTION_INSTANCE_ID: "i-035c86b6405b6ab1b"
        SSH_KEY_PATH_ON_BASTION: "/usr/bin/vaas-staging/vault-staging-ssh-key.pem"
        SSH_USER: "ubuntu"
        VAULT_ADDR_LOCAL: "https://127.0.0.1:8200"
        VAULT_CACERT_PATH: "/etc/vault.d/tls/ca.pem"

      - TARGET: "DR"
        AWS_REGION: "us-east-1"
        VAULT_TAG_NAME: "vaas-dev-dr"
        BASTION_INSTANCE_ID: "i-076259481ae826b71"
        SSH_KEY_PATH_ON_BASTION: "/usr/bin/vaas-staging/vault-staging-ssh-key.pem"
        SSH_USER: "ubuntu"
        VAULT_ADDR_LOCAL: "https://127.0.0.1:8200"
        VAULT_CACERT_PATH: "/etc/vault.d/tls/ca.pem"

  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.corp.zscaler.com

  before_script:
    - set -euo pipefail
    - yum -y install bash coreutils >/dev/null 2>&1 || true
    - aws --version

  script:
    # 1) Assume AWS role via OIDC
    - |
      echo "=== [$TARGET] Assuming role via OIDC ==="
      aws_sts_output="$(aws sts assume-role-with-web-identity \
        --role-arn "${STAGE_ROLE_ARN}" \
        --role-session-name "GitLabRunner-${CI_PROJECT_ID}-${CI_PIPELINE_ID}-${TARGET}" \
        --web-identity-token "${GITLAB_OIDC_TOKEN}" \
        --duration-seconds 3600 \
        --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
        --output text)"

      export AWS_ACCESS_KEY_ID="$(echo "$aws_sts_output" | awk '{print $1}')"
      export AWS_SECRET_ACCESS_KEY="$(echo "$aws_sts_output" | awk '{print $2}')"
      export AWS_SESSION_TOKEN="$(echo "$aws_sts_output" | awk '{print $3}')"

      echo "Caller identity:"
      aws sts get-caller-identity

    # 2) Discover Vault node IPs by tag
    - |
      echo "=== [$TARGET] Discovering Vault nodes (Name=${VAULT_TAG_NAME}) in ${AWS_REGION} ==="
      VAULT_NODE_IPS="$(
        aws ec2 describe-instances \
          --region "${AWS_REGION}" \
          --filters \
            "Name=tag:Name,Values=${VAULT_TAG_NAME}" \
            "Name=instance-state-name,Values=running" \
          --query 'Reservations[].Instances[].PrivateIpAddress' \
          --output text | tr '\t' '\n'
      )"

      if [ -z "${VAULT_NODE_IPS}" ]; then
        echo "ERROR: No running instances found for Name=${VAULT_TAG_NAME} in ${AWS_REGION}"
        exit 1
      fi

      echo "Discovered node IPs:"
      echo "${VAULT_NODE_IPS}"

      VAULT_NODE_IPS_ONE_LINE="$(echo "${VAULT_NODE_IPS}" | tr '\n' ' ' | xargs)"
      export VAULT_NODE_IPS_ONE_LINE

    # 3) Build bastion script safely (NO variable expansion on runner)
    - |
      echo "=== [$TARGET] Building bastion script (leader = Active Node Address) ==="

      cat > vault_leader_status.sh <<'EOF'
      #!/bin/bash
      set -euo pipefail

      VAULT_NODE_IPS_ONE_LINE="__VAULT_NODE_IPS__"
      SSH_KEY_PATH_ON_BASTION="__SSH_KEY__"
      SSH_USER="__SSH_USER__"
      VAULT_ADDR_LOCAL="__VAULT_ADDR__"
      VAULT_CACERT_PATH="__VAULT_CACERT__"

      echo "Running on bastion: $(hostname)"
      echo "Candidate Vault nodes: ${VAULT_NODE_IPS_ONE_LINE}"

      run_status() {
        local ip="$1"
        sudo -i bash -lc "ssh -i ${SSH_KEY_PATH_ON_BASTION} \
          -o StrictHostKeyChecking=no \
          -o UserKnownHostsFile=/dev/null \
          ${SSH_USER}@${ip} \
          \"sudo -i bash -lc 'export VAULT_ADDR=${VAULT_ADDR_LOCAL}; export VAULT_CACERT=${VAULT_CACERT_PATH}; vault status'\""
      }

      # 1) Find a seed node that responds
      SEED_OUT=""
      SEED_IP=""
      for ip in ${VAULT_NODE_IPS_ONE_LINE}; do
        echo "### Probing seed node ${ip} ..."
        set +e
        out="$(run_status "${ip}" 2>&1)"
        rc=$?
        set -e
        if [ $rc -eq 0 ]; then
          SEED_OUT="${out}"
          SEED_IP="${ip}"
          break
        fi
      done

      if [ -z "${SEED_OUT}" ]; then
        echo "ERROR: Could not run 'vault status' on any node."
        exit 2
      fi

      echo "Seed node used: ${SEED_IP}"

      # 2) Extract Active Node Address from table output (no colon)
      # Example line: "Active Node Address    https://ip-10-75-0-126.ec2.internal:8200"
      ACTIVE_ADDR="$(
        echo "${SEED_OUT}" \
          | tr -d '\r' \
          | awk '$1=="Active" && $2=="Node" && $3=="Address" {print $4; exit}'
      )"

      if [ -z "${ACTIVE_ADDR}" ]; then
        echo "ERROR: Could not extract 'Active Node Address' from seed output."
        echo "---- seed vault status ----"
        echo "${SEED_OUT}"
        exit 2
      fi

      echo "Active Node Address (leader): ${ACTIVE_ADDR}"

      # 3) Derive leader IP from hostname (no DNS dependency)
      # ACTIVE_ADDR => https://ip-10-75-0-126.ec2.internal:8200
      ACTIVE_HOST="$(echo "${ACTIVE_ADDR}" | sed -E 's|^https?://||; s|:.*$||')"
      LEADER_IP="$(echo "${ACTIVE_HOST}" | sed -n 's/^ip-\([0-9]\+\)-\([0-9]\+\)-\([0-9]\+\)-\([0-9]\+\).*/\1.\2.\3.\4/p')"

      if [ -z "${LEADER_IP}" ]; then
        echo "ERROR: Could not derive leader IP from hostname: ${ACTIVE_HOST}"
        exit 2
      fi

      echo "Resolved leader IP: ${LEADER_IP}"

      # 4) Run vault status on leader and print
      echo ""
      echo "==== vault status (LEADER ${LEADER_IP}) ===="
      LEADER_OUT="$(run_status "${LEADER_IP}")"
      echo "${LEADER_OUT}"
      EOF

      # Inject runtime values (runner-side) into placeholders
      sed -i \
        -e "s|__VAULT_NODE_IPS__|${VAULT_NODE_IPS_ONE_LINE}|g" \
        -e "s|__SSH_KEY__|${SSH_KEY_PATH_ON_BASTION}|g" \
        -e "s|__SSH_USER__|${SSH_USER}|g" \
        -e "s|__VAULT_ADDR__|${VAULT_ADDR_LOCAL}|g" \
        -e "s|__VAULT_CACERT__|${VAULT_CACERT_PATH}|g" \
        vault_leader_status.sh

      chmod +x vault_leader_status.sh
      B64_SCRIPT="$(base64 vault_leader_status.sh | tr -d '\n')"
      export B64_SCRIPT

    # 4) Send to bastion via SSM
    - |
      echo "=== [$TARGET] Sending SSM command to ${BASTION_INSTANCE_ID} in ${AWS_REGION} ==="
      CMD_ID="$(aws ssm send-command \
        --region "${AWS_REGION}" \
        --instance-ids "${BASTION_INSTANCE_ID}" \
        --document-name "AWS-RunShellScript" \
        --parameters "commands=[
          \"echo ${B64_SCRIPT} | base64 -d > /tmp/vault_leader_status.sh\",
          \"chmod +x /tmp/vault_leader_status.sh\",
          \"bash /tmp/vault_leader_status.sh\"
        ]" \
        --query "Command.CommandId" \
        --output text)"

      echo "SSM CommandId: ${CMD_ID}"

    # 5) Wait + print output (always show stdout/stderr)
    - |
      echo "=== [$TARGET] Waiting for SSM execution ==="
      set +e
      aws ssm wait command-executed \
        --region "${AWS_REGION}" \
        --command-id "${CMD_ID}" \
        --instance-id "${BASTION_INSTANCE_ID}"
      WAIT_RC=$?
      set -e

      echo "==== [$TARGET] STDOUT ===="
      aws ssm get-command-invocation \
        --region "${AWS_REGION}" \
        --command-id "${CMD_ID}" \
        --instance-id "${BASTION_INSTANCE_ID}" \
        --query "StandardOutputContent" \
        --output text || true

      echo "==== [$TARGET] STDERR ===="
      aws ssm get-command-invocation \
        --region "${AWS_REGION}" \
        --command-id "${CMD_ID}" \
        --instance-id "${BASTION_INSTANCE_ID}" \
        --query "StandardErrorContent" \
        --output text || true

      exit $WAIT_RC