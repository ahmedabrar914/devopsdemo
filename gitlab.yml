workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH'

stages:
  - vault_status

default:
  image: amazon/aws-cli:2.15.57
  tags:
    - sqrunners-k8s
  before_script:
    - set -euo pipefail
    # If your runner needs internet allow label, keep this (you mentioned it in earlier logs)
    # If your runner doesn't need it, you can remove this variable block.
  variables:
    # IMPORTANT: prevents STS call going to sts.<region>.amazonaws.com (your DR was timing out on sts.us-east-1)
    AWS_STS_REGIONAL_ENDPOINTS: "legacy"

    # Vault common
    VAULT_ADDR_LOCAL: "https://127.0.0.1:8200"
    VAULT_CACERT_PATH: "/etc/vault.d/tls/ca.pem"

    # IAM role assumed via OIDC (same for both jobs)
    STAGE_ROLE_ARN: "arn:aws:iam::792014834907:role/gitlab-vaas-iac-role"

vault-status-primary:
  stage: vault_status
  # If your cluster requires this label to reach AWS endpoints, keep it.
  # Otherwise you can remove it.
  variables:
    KUBERNETES_POD_LABELS_INTERNET_ALLOW: "internet-allow"
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: "https://gitlab.corp.zscaler.com"
  script:
    - set -euo pipefail
    - echo "=== [PRIMARY] Installing tools ==="
    - yum -y install jq openssh-clients coreutils >/dev/null 2>&1 || true
    - jq --version
    - aws --version

    - echo "=== [PRIMARY] Assume role via OIDC (STS global endpoint) ==="
    - |
      aws_sts_output="$(aws sts assume-role-with-web-identity \
        --role-arn "${STAGE_ROLE_ARN}" \
        --role-session-name "GitLabRunner-${CI_PROJECT_ID}-${CI_PIPELINE_ID}-PRIMARY" \
        --web-identity-token "${GITLAB_OIDC_TOKEN}" \
        --duration-seconds 3600)"
      export AWS_ACCESS_KEY_ID="$(echo "$aws_sts_output" | jq -r '.Credentials.AccessKeyId')"
      export AWS_SECRET_ACCESS_KEY="$(echo "$aws_sts_output" | jq -r '.Credentials.SecretAccessKey')"
      export AWS_SESSION_TOKEN="$(echo "$aws_sts_output" | jq -r '.Credentials.SessionToken')"
    - aws sts get-caller-identity

    # ---- PRIMARY specifics ----
    - |
      PRIMARY_REGION="us-west-2"
      PRIMARY_BASTION_INSTANCE_ID="i-035c86b6405b6ab1b"
      PRIMARY_VAULT_TAG_NAME="vaas-staging"
      PRIMARY_SSH_KEY_PATH_ON_BASTION="/usr/bin/vaas-staging/vault-staging-ssh-key.pem"
      PRIMARY_VAULT_SSH_USER="ubuntu"

      echo "=== [PRIMARY] Discovering Vault node IPs by tag Name=${PRIMARY_VAULT_TAG_NAME} in ${PRIMARY_REGION} ==="
      PRIMARY_NODE_IPS="$(aws ec2 describe-instances \
        --region "${PRIMARY_REGION}" \
        --filters "Name=tag:Name,Values=${PRIMARY_VAULT_TAG_NAME}" "Name=instance-state-name,Values=running" \
        --query "Reservations[].Instances[].PrivateIpAddress" \
        --output text)"

      echo "Found node IPs: ${PRIMARY_NODE_IPS}"
      echo "Bastion: ${PRIMARY_BASTION_INSTANCE_ID}"

      if [ -z "${PRIMARY_NODE_IPS}" ]; then
        echo "ERROR: No Vault nodes found for tag Name=${PRIMARY_VAULT_TAG_NAME} in ${PRIMARY_REGION}"
        exit 1
      fi

      echo "=== [PRIMARY] Building script to run ON BASTION (find leader then vault status) ==="
      cat > run_on_bastion_primary.sh <<'EOS'
      set -euo pipefail

      VAULT_NODE_IPS="__VAULT_NODE_IPS__"
      SSH_KEY="__SSH_KEY__"
      SSH_USER="__SSH_USER__"
      VAULT_ADDR_LOCAL="__VAULT_ADDR_LOCAL__"
      VAULT_CACERT_PATH="__VAULT_CACERT_PATH__"

      run_status() {
        local ip="$1"
        sudo -i bash -lc "ssh -i '${SSH_KEY}' \
          -o StrictHostKeyChecking=no \
          -o UserKnownHostsFile=/dev/null \
          ${SSH_USER}@${ip} \
          \"sudo -i bash -lc 'export VAULT_ADDR=${VAULT_ADDR_LOCAL}; export VAULT_CACERT=${VAULT_CACERT_PATH}; vault status'\""
      }

      echo "Checking nodes to find leader (HA Mode: active)..."
      LEADER_IP=""
      for ip in ${VAULT_NODE_IPS}; do
        echo "---- Trying ${ip} ----"
        OUT="$(run_status "${ip}" 2>&1 || true)"
        echo "${OUT}"

        # Identify leader by "HA Mode" line
        if echo "${OUT}" | grep -qiE '^HA Mode[[:space:]]+active$'; then
          LEADER_IP="${ip}"
          break
        fi
      done

      if [ -z "${LEADER_IP}" ]; then
        echo "ERROR: Could not find leader (no node returned 'HA Mode active')."
        exit 2
      fi

      echo "=== LEADER FOUND: ${LEADER_IP} ==="
      echo "=== Running final leader status ==="
      run_status "${LEADER_IP}"
EOS

      # Replace placeholders safely (no sed weirdness)
      perl -0777 -i -pe "s|__VAULT_NODE_IPS__|${PRIMARY_NODE_IPS}|g;
                         s|__SSH_KEY__|${PRIMARY_SSH_KEY_PATH_ON_BASTION}|g;
                         s|__SSH_USER__|${PRIMARY_VAULT_SSH_USER}|g;
                         s|__VAULT_ADDR_LOCAL__|${VAULT_ADDR_LOCAL}|g;
                         s|__VAULT_CACERT_PATH__|${VAULT_CACERT_PATH}|g;" run_on_bastion_primary.sh

      echo "=== [PRIMARY] Base64 encode script and send via SSM ==="
      B64="$(base64 -w 0 run_on_bastion_primary.sh)"
      SSM_CMD="echo '${B64}' | base64 -d > /tmp/run_on_bastion_primary.sh && chmod +x /tmp/run_on_bastion_primary.sh && /tmp/run_on_bastion_primary.sh"

      PARAMS="$(jq -nc --arg cmd "${SSM_CMD}" '{commands:[$cmd]}')"

      CMD_ID="$(aws ssm send-command \
        --region "${PRIMARY_REGION}" \
        --instance-ids "${PRIMARY_BASTION_INSTANCE_ID}" \
        --document-name "AWS-RunShellScript" \
        --parameters "${PARAMS}" \
        --query "Command.CommandId" \
        --output text)"

      echo "CommandId: ${CMD_ID}"

      # Wait + print output
      aws ssm wait command-executed --region "${PRIMARY_REGION}" --command-id "${CMD_ID}" --instance-id "${PRIMARY_BASTION_INSTANCE_ID}" || true

      echo "===== [PRIMARY] STDOUT ====="
      aws ssm get-command-invocation \
        --region "${PRIMARY_REGION}" \
        --command-id "${CMD_ID}" \
        --instance-id "${PRIMARY_BASTION_INSTANCE_ID}" \
        --query "StandardOutputContent" \
        --output text || true

      echo "===== [PRIMARY] STDERR ====="
      aws ssm get-command-invocation \
        --region "${PRIMARY_REGION}" \
        --command-id "${CMD_ID}" \
        --instance-id "${PRIMARY_BASTION_INSTANCE_ID}" \
        --query "StandardErrorContent" \
        --output text || true

      # Fail pipeline if command not successful
      STATUS="$(aws ssm get-command-invocation \
        --region "${PRIMARY_REGION}" \
        --command-id "${CMD_ID}" \
        --instance-id "${PRIMARY_BASTION_INSTANCE_ID}" \
        --query "Status" \
        --output text)"
      echo "===== [PRIMARY] SSM Status: ${STATUS} ====="
      [ "${STATUS}" = "Success" ]

