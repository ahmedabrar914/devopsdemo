        --output text || true

      echo "===== [DR] STDERR ====="
      aws ssm get-command-invocation \
        --region "${DR_REGION}" \
        --command-id "${CMD_ID}" \
        --instance-id "${DR_BASTION_INSTANCE_ID}" \
