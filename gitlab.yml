workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "api"'
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - when: never

stages:
  - status

variables:
  # Role used by GitLab OIDC to get AWS creds (staging account)
  STAGE_ROLE_ARN: "arn:aws:iam::792014834907:role/gitlab-vaas-iac-role"

  # allow internet label if your k8s runner needs it (optional)
  KUBERNETES_POD_LABELS_INTERNET_ALLOW: "internet=allow"

vault-status:
  stage: status
  image: amazon/aws-cli:2.15.57
  parallel:
    matrix:
      - TARGET: "PRIMARY"
        AWS_REGION: "us-west-2"
        BASTION_INSTANCE_ID: "i-PRIMARY_BASTION_ID"
        VAULT_NODE_IP: "10.x.x.x"
        SSH_KEY_PATH_ON_BASTION: "/usr/bin/vaas-staging/vault-staging-ssh-key.pem"
        VAULT_ADDR_LOCAL: "https://127.0.0.1:8200"
        VAULT_CACERT_PATH: "/etc/vault.d/tls/ca.pem"

      - TARGET: "DR"
        AWS_REGION: "us-east-1"
        BASTION_INSTANCE_ID: "i-DR_BASTION_ID"
        VAULT_NODE_IP: "10.y.y.y"
        SSH_KEY_PATH_ON_BASTION: "/usr/bin/vaas-staging/vault-staging-ssh-key.pem"
        VAULT_ADDR_LOCAL: "https://127.0.0.1:8200"
        VAULT_CACERT_PATH: "/etc/vault.d/tls/ca.pem"

  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.corp.zscaler.com

  before_script:
    - set -euo pipefail
    # tools for base64/tr + bash scripts
    - yum -y install bash coreutils >/dev/null 2>&1 || true
    - aws --version

  script:
    # 1) Assume AWS role via OIDC
    - |
      echo "=== [$TARGET] Assuming role via OIDC ==="
      aws_sts_output="$(aws sts assume-role-with-web-identity \
        --role-arn "${STAGE_ROLE_ARN}" \
        --role-session-name "GitLabRunner-${CI_PROJECT_ID}-${CI_PIPELINE_ID}-${TARGET}" \
        --web-identity-token "${GITLAB_OIDC_TOKEN}" \
        --duration-seconds 3600 \
        --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
        --output text)"

      export AWS_ACCESS_KEY_ID="$(echo "$aws_sts_output" | awk '{print $1}')"
      export AWS_SECRET_ACCESS_KEY="$(echo "$aws_sts_output" | awk '{print $2}')"
      export AWS_SESSION_TOKEN="$(echo "$aws_sts_output" | awk '{print $3}')"

      echo "Caller identity:"
      aws sts get-caller-identity

    # 2) Build a bash script to run ON THE BASTION (avoids JSON quoting issues)
    - |
      echo "=== [$TARGET] Building bastion script ==="
      cat > vault_status.sh <<EOF
      #!/bin/bash
      set -euo pipefail

      echo "Running on bastion: \$(hostname)"
      echo "Vault node: ${VAULT_NODE_IP}"

      sudo -i bash -lc "ssh -i ${SSH_KEY_PATH_ON_BASTION} \
        -o StrictHostKeyChecking=no \
        -o UserKnownHostsFile=/dev/null \
        ubuntu@${VAULT_NODE_IP} \
        \\"sudo -i bash -lc 'export VAULT_ADDR=${VAULT_ADDR_LOCAL}; export VAULT_CACERT=${VAULT_CACERT_PATH}; vault status'\\""
      EOF

      chmod +x vault_status.sh
      B64_SCRIPT="$(base64 vault_status.sh | tr -d '\n')"

    # 3) Send command to the correct region's bastion
    - |
      echo "=== [$TARGET] Sending SSM command to ${BASTION_INSTANCE_ID} in ${AWS_REGION} ==="

      CMD_ID="$(aws ssm send-command \
        --region "${AWS_REGION}" \
        --instance-ids "${BASTION_INSTANCE_ID}" \
        --document-name "AWS-RunShellScript" \
        --parameters "commands=[
          \"echo ${B64_SCRIPT} | base64 -d > /tmp/vault_status.sh\",
          \"chmod +x /tmp/vault_status.sh\",
          \"bash /tmp/vault_status.sh\"
        ]" \
        --query "Command.CommandId" \
        --output text)"

      echo "SSM CommandId: ${CMD_ID}"

    # 4) Wait + print output (even if it fails)
    - |
      echo "=== [$TARGET] Waiting for SSM execution ==="
      set +e
      aws ssm wait command-executed \
        --region "${AWS_REGION}" \
        --command-id "${CMD_ID}" \
        --instance-id "${BASTION_INSTANCE_ID}"
      WAIT_RC=$?
      set -e

      echo "==== [$TARGET] STDOUT ===="
      aws ssm get-command-invocation \
        --region "${AWS_REGION}" \
        --command-id "${CMD_ID}" \
        --instance-id "${BASTION_INSTANCE_ID}" \
        --query "StandardOutputContent" \
        --output text || true

      echo "==== [$TARGET] STDERR ===="
      aws ssm get-command-invocation \
        --region "${AWS_REGION}" \
        --command-id "${CMD_ID}" \
        --instance-id "${BASTION_INSTANCE_ID}" \
        --query "StandardErrorContent" \
        --output text || true

      exit $WAIT_RC