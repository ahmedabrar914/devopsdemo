      echo "CommandId: ${CMD_ID}"

      aws ssm wait command-executed --region "${DR_REGION}" --command-id "${CMD_ID}" --instance-id "${DR_BASTION_INSTANCE_ID}" || true

      echo "===== [DR] STDOUT ====="
      aws ssm get-command-invocation \
        --region "${DR_REGION}" \
        --command-id "${CMD_ID}" \
        --instance-id "${DR_BASTION_INSTANCE_ID}" \
