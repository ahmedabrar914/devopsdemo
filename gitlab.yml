workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH'

stages:
  - vault_status

vault-status-primary:
  stage: vault_status
  image: amazon/aws-cli:2.15.57
  tags:
    - sqrunners-k8s
  variables:
    KUBERNETES_POD_LABELS_INTERNET_ALLOW: "internet-allow"
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: "https://gitlab.corp.zscaler.com"
  script:
    - set -euo pipefail

    # --------- FIXES for your runner ----------
    - yum -y install jq openssh-clients coreutils perl >/dev/null 2>&1 || true
    - aws --version
    - jq --version || true

    # --------- PRIMARY CONFIG (kept in job only) ----------
    - PRIMARY_REGION="us-west-2"
    - PRIMARY_BASTION_INSTANCE_ID="i-035c86b6405b6ab1b"
    - PRIMARY_VAULT_TAG_NAME="vaas-staging"
    - PRIMARY_SSH_KEY_PATH_ON_BASTION="/usr/bin/vaas-staging/vault-staging-ssh-key.pem"
    - PRIMARY_VAULT_SSH_USER="ubuntu"
    - VAULT_ADDR_LOCAL="https://127.0.0.1:8200"
    - VAULT_CACERT_PATH="/etc/vault.d/tls/ca.pem"
    - STAGE_ROLE_ARN="arn:aws:iam::792014834907:role/gitlab-vaas-iac-role"

    # --------- Assume role (OIDC) ----------
    - echo "=== [PRIMARY] Assume role via OIDC ==="
    - |
      aws_sts_output="$(aws sts assume-role-with-web-identity \
        --role-arn "${STAGE_ROLE_ARN}" \
        --role-session-name "GitLabRunner-${CI_PROJECT_ID}-${CI_PIPELINE_ID}-PRIMARY" \
        --web-identity-token "${GITLAB_OIDC_TOKEN}" \
        --duration-seconds 3600)"
      export AWS_ACCESS_KEY_ID="$(echo "$aws_sts_output" | jq -r '.Credentials.AccessKeyId')"
      export AWS_SECRET_ACCESS_KEY="$(echo "$aws_sts_output" | jq -r '.Credentials.SecretAccessKey')"
      export AWS_SESSION_TOKEN="$(echo "$aws_sts_output" | jq -r '.Credentials.SessionToken')"
    - aws sts get-caller-identity

    # --------- Find all vault node private IPs ----------
    - echo "=== [PRIMARY] Discovering Vault nodes by tag Name=${PRIMARY_VAULT_TAG_NAME} in ${PRIMARY_REGION} ==="
    - |
      PRIMARY_NODE_IPS="$(aws ec2 describe-instances \
        --region "${PRIMARY_REGION}" \
        --filters "Name=tag:Name,Values=${PRIMARY_VAULT_TAG_NAME}" "Name=instance-state-name,Values=running" \
        --query "Reservations[].Instances[].PrivateIpAddress" \
        --output text)"
      echo "Found node IPs: ${PRIMARY_NODE_IPS}"
      [ -n "${PRIMARY_NODE_IPS}" ]

    # --------- Build bastion script (leader detection + status) ----------
    - echo "=== [PRIMARY] Build script to run on bastion ==="
    - |
      cat > run_on_bastion_primary.sh <<'EOS'
      set -euo pipefail

      VAULT_NODE_IPS="__VAULT_NODE_IPS__"
      SSH_KEY="__SSH_KEY__"
      SSH_USER="__SSH_USER__"
      VAULT_ADDR_LOCAL="__VAULT_ADDR_LOCAL__"
      VAULT_CACERT_PATH="__VAULT_CACERT_PATH__"

      run_status() {
        local ip="$1"
        sudo -i bash -lc "ssh -i '${SSH_KEY}' \
          -o StrictHostKeyChecking=no \
          -o UserKnownHostsFile=/dev/null \
          ${SSH_USER}@${ip} \
          \"sudo -i bash -lc 'export VAULT_ADDR=${VAULT_ADDR_LOCAL}; export VAULT_CACERT=${VAULT_CACERT_PATH}; vault status'\""
      }

      LEADER_IP=""
      for ip in ${VAULT_NODE_IPS}; do
        OUT="$(run_status "${ip}" 2>&1 || true)"
        if echo "${OUT}" | grep -qiE '^HA Mode[[:space:]]+active$'; then
          LEADER_IP="${ip}"
          break
        fi
      done

      if [ -z "${LEADER_IP}" ]; then
        echo "ERROR: Leader not found (no node returned HA Mode active)"
        exit 2
      fi

      echo "=== PRIMARY LEADER: ${LEADER_IP} ==="
      run_status "${LEADER_IP}"
EOS

      perl -0777 -i -pe "s|__VAULT_NODE_IPS__|${PRIMARY_NODE_IPS}|g;
                         s|__SSH_KEY__|${PRIMARY_SSH_KEY_PATH_ON_BASTION}|g;
                         s|__SSH_USER__|${PRIMARY_VAULT_SSH_USER}|g;
                         s|__VAULT_ADDR_LOCAL__|${VAULT_ADDR_LOCAL}|g;
                         s|__VAULT_CACERT_PATH__|${VAULT_CACERT_PATH}|g;" run_on_bastion_primary.sh

    # --------- Send via SSM (simple, like your earlier working approach) ----------
    - echo "=== [PRIMARY] Send SSM command ==="
    - |
      B64="$(base64 -w 0 run_on_bastion_primary.sh)"
      CMD="echo '${B64}' | base64 -d > /tmp/run_on_bastion_primary.sh && chmod +x /tmp/run_on_bastion_primary.sh && /tmp/run_on_bastion_primary.sh"
      PARAMS="$(jq -nc --arg c "${CMD}" '{commands:[$c]}')"

      CMD_ID="$(aws ssm send-command \
        --region "${PRIMARY_REGION}" \
        --instance-ids "${PRIMARY_BASTION_INSTANCE_ID}" \
        --document-name "AWS-RunShellScript" \
        --parameters "${PARAMS}" \
        --query "Command.CommandId" \
        --output text)"

      echo "PRIMARY CommandId: ${CMD_ID}"
      aws ssm wait command-executed --region "${PRIMARY_REGION}" --command-id "${CMD_ID}" --instance-id "${PRIMARY_BASTION_INSTANCE_ID}" || true

      echo "===== [PRIMARY] STDOUT ====="
      aws ssm get-command-invocation --region "${PRIMARY_REGION}" --command-id "${CMD_ID}" --instance-id "${PRIMARY_BASTION_INSTANCE_ID}" --query "StandardOutputContent" --output text || true

      echo "===== [PRIMARY] STDERR ====="
      aws ssm get-command-invocation --region "${PRIMARY_REGION}" --command-id "${CMD_ID}" --instance-id "${PRIMARY_BASTION_INSTANCE_ID}" --query "StandardErrorContent" --output text || true

      STATUS="$(aws ssm get-command-invocation --region "${PRIMARY_REGION}" --command-id "${CMD_ID}" --instance-id "${PRIMARY_BASTION_INSTANCE_ID}" --query "Status" --output text)"
      echo "PRIMARY SSM Status: ${STATUS}"
      [ "${STATUS}" = "Success" ]

vault-status-dr:
