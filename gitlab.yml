workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "api"'
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - when: never

stages:
  - status

variables:
  STAGE_ROLE_ARN: "arn:aws:iam::792014834907:role/gitlab-vaas-iac-role"
  KUBERNETES_POD_LABELS_INTERNET_ALLOW: "internet=allow"

vault-leader-status:
  stage: status
  image: amazon/aws-cli:2.15.57

  parallel:
    matrix:
      - TARGET: "PRIMARY"
        AWS_REGION: "us-west-2"
        VAULT_TAG_NAME: "vaas-staging"
        BASTION_INSTANCE_ID: "i-PRIMARY_BASTION_ID"
        SSH_KEY_PATH_ON_BASTION: "/usr/bin/vaas-staging/vault-staging-ssh-key.pem"
        SSH_USER: "ubuntu"
        VAULT_ADDR_LOCAL: "https://127.0.0.1:8200"
        VAULT_CACERT_PATH: "/etc/vault.d/tls/ca.pem"

      - TARGET: "DR"
        AWS_REGION: "us-east-1"
        VAULT_TAG_NAME: "vaas-dev-dr"
        BASTION_INSTANCE_ID: "i-DR_BASTION_ID"
        SSH_KEY_PATH_ON_BASTION: "/usr/bin/vaas-staging/vault-staging-ssh-key.pem"
        SSH_USER: "ubuntu"
        VAULT_ADDR_LOCAL: "https://127.0.0.1:8200"
        VAULT_CACERT_PATH: "/etc/vault.d/tls/ca.pem"

  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.corp.zscaler.com

  before_script:
    - set -euo pipefail
    - yum -y install bash coreutils >/dev/null 2>&1 || true
    - aws --version

  script:
    # 1) Assume AWS role via OIDC
    - |
      echo "=== [$TARGET] Assuming role via OIDC ==="
      aws_sts_output="$(aws sts assume-role-with-web-identity \
        --role-arn "${STAGE_ROLE_ARN}" \
        --role-session-name "GitLabRunner-${CI_PROJECT_ID}-${CI_PIPELINE_ID}-${TARGET}" \
        --web-identity-token "${GITLAB_OIDC_TOKEN}" \
        --duration-seconds 3600 \
        --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
        --output text)"

      export AWS_ACCESS_KEY_ID="$(echo "$aws_sts_output" | awk '{print $1}')"
      export AWS_SECRET_ACCESS_KEY="$(echo "$aws_sts_output" | awk '{print $2}')"
      export AWS_SESSION_TOKEN="$(echo "$aws_sts_output" | awk '{print $3}')"

      aws sts get-caller-identity

    # 2) Discover Vault node IPs by tag (expect 6)
    - |
      echo "=== [$TARGET] Discovering Vault nodes (tag Name=${VAULT_TAG_NAME}) in ${AWS_REGION} ==="
      VAULT_NODE_IPS="$(
        aws ec2 describe-instances \
          --region "${AWS_REGION}" \
          --filters \
            "Name=tag:Name,Values=${VAULT_TAG_NAME}" \
            "Name=instance-state-name,Values=running" \
          --query 'Reservations[].Instances[].PrivateIpAddress' \
          --output text | tr '\t' '\n'
      )"

      if [ -z "${VAULT_NODE_IPS}" ]; then
        echo "ERROR: No running instances found for Name=${VAULT_TAG_NAME} in ${AWS_REGION}"
        exit 1
      fi

      echo "Discovered node IPs:"
      echo "${VAULT_NODE_IPS}"

      VAULT_NODE_IPS_ONE_LINE="$(echo "${VAULT_NODE_IPS}" | tr '\n' ' ' | xargs)"
      export VAULT_NODE_IPS_ONE_LINE

    # 3) Build script to run on bastion (SSM)
    - |
      echo "=== [$TARGET] Building bastion leader-check script (vault status) ==="
      cat > vault_leader_status.sh <<EOF
      #!/bin/bash
      set -euo pipefail

      echo "Running on bastion: \$(hostname)"
      echo "Candidate Vault nodes: ${VAULT_NODE_IPS_ONE_LINE}"

      # Run vault status on a single node (no token required)
      run_status() {
        local ip="\$1"
        sudo -i bash -lc "ssh -i ${SSH_KEY_PATH_ON_BASTION} \
          -o StrictHostKeyChecking=no \
          -o UserKnownHostsFile=/dev/null \
          ${SSH_USER}@\${ip} \
          \\"sudo -i bash -lc 'export VAULT_ADDR=${VAULT_ADDR_LOCAL}; export VAULT_CACERT=${VAULT_CACERT_PATH}; vault status'\\""
      }

      LEADER_IP=""
      LEADER_OUT=""
      echo "---- Probing nodes for leader (HA Mode: active) ----"

      for ip in ${VAULT_NODE_IPS_ONE_LINE}; do
        echo ""
        echo "### Checking \${ip} ..."
        set +e
        out="\$(run_status "\${ip}" 2>&1)"
        rc=\$?
        set -e

        if [ \$rc -ne 0 ]; then
          echo "WARN: vault status failed on \${ip} (rc=\${rc})"
          echo "\${out}"
          continue
        fi

        # show quick summary line
        ha_mode="\$(echo "\${out}" | awk -F: '/^HA Mode/ {gsub(/^[ \t]+|[ \t]+$/, "", \$2); print \$2; exit}')"
        active_addr="\$(echo "\${out}" | awk -F: '/^Active Node Address/ {gsub(/^[ \t]+|[ \t]+$/, "", \$2); print \$2; exit}')"
        echo "HA Mode=\${ha_mode:-unknown} ActiveNode=\${active_addr:-n/a}"

        # Leader detection (matches your working output)
        if echo "\${out}" | grep -Eiq '^HA Mode[[:space:]]*:[[:space:]]*active\\b'; then
          LEADER_IP="\${ip}"
          LEADER_OUT="\${out}"
          break
        fi
      done

      echo ""
      echo "==== RESULT ===="
      if [ -n "\${LEADER_IP}" ]; then
        echo "Leader (active) node: \${LEADER_IP}"
        echo "---- vault status (leader) ----"
        echo "\${LEADER_OUT}"
        exit 0
      fi

      echo "ERROR: No active leader found in node list."
      echo "Dumping active-node hints from nodes that responded:"
      for ip in ${VAULT_NODE_IPS_ONE_LINE}; do
        set +e
        out="\$(run_status "\${ip}" 2>/dev/null)"
        rc=\$?
        set -e
        if [ \$rc -eq 0 ]; then
          hint="\$(echo "\${out}" | awk -F: '/^Active Node Address/ {gsub(/^[ \t]+|[ \t]+$/, "", \$2); print \$2; exit}')"
          mode="\$(echo "\${out}" | awk -F: '/^HA Mode/ {gsub(/^[ \t]+|[ \t]+$/, "", \$2); print \$2; exit}')"
          echo "\${ip}: HA=\${mode:-?} ActiveNode=\${hint:-?}"
        fi
      done

      exit 2
      EOF

      chmod +x vault_leader_status.sh
      B64_SCRIPT="$(base64 vault_leader_status.sh | tr -d '\n')"
      export B64_SCRIPT

    # 4) Send to bastion via SSM + print output
    - |
      echo "=== [$TARGET] Sending SSM command to ${BASTION_INSTANCE_ID} in ${AWS_REGION} ==="
      CMD_ID="$(aws ssm send-command \
        --region "${AWS_REGION}" \
        --instance-ids "${BASTION_INSTANCE_ID}" \
        --document-name "AWS-RunShellScript" \
        --parameters "commands=[
          \"echo ${B64_SCRIPT} | base64 -d > /tmp/vault_leader_status.sh\",
          \"chmod +x /tmp/vault_leader_status.sh\",
          \"bash /tmp/vault_leader_status.sh\"
        ]" \
        --query "Command.CommandId" \
        --output text)"
      echo "SSM CommandId: ${CMD_ID}"

    - |
      echo "=== [$TARGET] Waiting for SSM execution ==="
      set +e
      aws ssm wait command-executed \
        --region "${AWS_REGION}" \
        --command-id "${CMD_ID}" \
        --instance-id "${BASTION_INSTANCE_ID}"
      WAIT_RC=$?
      set -e

      echo "==== [$TARGET] STDOUT ===="
      aws ssm get-command-invocation \
        --region "${AWS_REGION}" \
        --command-id "${CMD_ID}" \
        --instance-id "${BASTION_INSTANCE_ID}" \
        --query "StandardOutputContent" \
        --output text || true

      echo "==== [$TARGET] STDERR ===="
      aws ssm get-command-invocation \
        --region "${AWS_REGION}" \
        --command-id "${CMD_ID}" \
        --instance-id "${BASTION_INSTANCE_ID}" \
        --query "StandardErrorContent" \
        --output text || true

      exit $WAIT_RC