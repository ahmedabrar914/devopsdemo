workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

stages:
  - status

variables:
  # --------- STAGING ONLY ----------
  AWS_REGION: "us-west-2"

  # Bastion where SSM will run
  BASTION_INSTANCE_ID: "i-035c86b6405b6ab1b"

  # Vault node private IP reachable from bastion
  VAULT_NODE_IP: "10.82.0.111"

  # SSH key path ON THE BASTION HOST (must exist there)
  SSH_KEY_PATH_ON_BASTION: "/usr/bin/vaas-staging/vault-staging-ssh-key.pem"

  # Vault CLI needs these as root on the vault node
  VAULT_ADDR_LOCAL: "https://127.0.0.1:8200"
  VAULT_CACERT_PATH: "/etc/vault.d/tls/ca.pem"

  # Role to assume (staging)
  STAGE_ROLE_ARN: "arn:aws:iam::792014834907:role/gitlab-vaas-iac-role"

vault_status_staging:
  stage: status
  image: amazon/aws-cli:2.15.57

  # OIDC token for STS assume-role-with-web-identity
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.corp.zscaler.com

  before_script:
    - set -euo pipefail
    - echo "Assuming role via OIDC..."
    - |
      aws_sts_output="$(aws sts assume-role-with-web-identity \
        --role-arn "${STAGE_ROLE_ARN}" \
        --role-session-name "GitLabRunner-${CI_PROJECT_ID}-${CI_PIPELINE_ID}" \
        --web-identity-token "${GITLAB_OIDC_TOKEN}" \
        --duration-seconds 3600 \
        --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
        --output text)"
      export AWS_ACCESS_KEY_ID="$(echo "$aws_sts_output" | awk '{print $1}')"
      export AWS_SECRET_ACCESS_KEY="$(echo "$aws_sts_output" | awk '{print $2}')"
      export AWS_SESSION_TOKEN="$(echo "$aws_sts_output" | awk '{print $3}')"
    - aws sts get-caller-identity

  script:
  - set -euo pipefail

  # Assume role
  - |
    aws_sts_output="$(aws sts assume-role-with-web-identity \
      --role-arn "${STAGE_ROLE_ARN}" \
      --role-session-name "GitLabRunner-${CI_PROJECT_ID}-${CI_PIPELINE_ID}" \
      --web-identity-token "${GITLAB_OIDC_TOKEN}" \
      --duration-seconds 3600 \
      --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
      --output text)"

    export AWS_ACCESS_KEY_ID="$(echo "$aws_sts_output" | awk '{print $1}')"
    export AWS_SECRET_ACCESS_KEY="$(echo "$aws_sts_output" | awk '{print $2}')"
    export AWS_SESSION_TOKEN="$(echo "$aws_sts_output" | awk '{print $3}')"

    aws sts get-caller-identity

  # Build script that will run ON BASTION
  - |
    cat > vault_status.sh <<EOF
#!/bin/bash
set -euo pipefail

sudo -i bash -lc "ssh -i ${SSH_KEY_PATH_ON_BASTION} \
  -o StrictHostKeyChecking=no \
  -o UserKnownHostsFile=/dev/null \
  ubuntu@${VAULT_NODE_IP} \
  \"sudo -i bash -lc 'export VAULT_ADDR=${VAULT_ADDR_LOCAL}; export VAULT_CACERT=${VAULT_CACERT_PATH}; vault status'\""
EOF

    chmod +x vault_status.sh

    echo "=== Script to run on bastion ==="
    cat vault_status.sh

    # Base64 encode it
    B64_SCRIPT=$(base64 vault_status.sh | tr -d '\n')

  # Send to SSM safely
  - |
    CMD_ID=$(aws ssm send-command \
      --region "${AWS_REGION}" \
      --instance-ids "${BASTION_INSTANCE_ID}" \
      --document-name "AWS-RunShellScript" \
      --parameters "commands=[
        \"echo ${B64_SCRIPT} | base64 -d > /tmp/vault_status.sh\",
        \"chmod +x /tmp/vault_status.sh\",
        \"bash /tmp/vault_status.sh\"
      ]" \
      --query "Command.CommandId" \
      --output text)

    echo "SSM CommandId: ${CMD_ID}"

  # Wait + print output (even if fails)
  - |
    set +e
    aws ssm wait command-executed \
      --region "${AWS_REGION}" \
      --command-id "${CMD_ID}" \
      --instance-id "${BASTION_INSTANCE_ID}"
    WAIT_RC=$?
    set -e

    echo "==== STDOUT ===="
    aws ssm get-command-invocation \
      --region "${AWS_REGION}" \
      --command-id "${CMD_ID}" \
      --instance-id "${BASTION_INSTANCE_ID}" \
      --query "StandardOutputContent" \
      --output text || true

    echo "==== STDERR ===="
    aws ssm get-command-invocation \
      --region "${AWS_REGION}" \
      --command-id "${CMD_ID}" \
      --instance-id "${BASTION_INSTANCE_ID}" \
      --query "StandardErrorContent" \
      --output text || true

    exit $WAIT_RC
      