        --output text || true

      STATUS="$(aws ssm get-command-invocation \
        --region "${DR_REGION}" \
        --command-id "${CMD_ID}" \
        --instance-id "${DR_BASTION_INSTANCE_ID}" \
        --query "Status" \
        --output text)"
      echo "===== [DR] SSM Status: ${STATUS} ====="
      [ "${STATUS}" = "Success" ]