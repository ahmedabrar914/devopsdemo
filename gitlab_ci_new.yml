workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

default:
  retry:
    max: 2
    when:
      - script_failure
      - runner_system_failure
      - unknown_failure
      - scheduler_failure

stages:
  - test
  - secret-detection
  - validate
  - terraform-format-check
  - terraform-scan
  - dev-primary-bootstrap-plan
  - dev-primary-bootstrap-apply
  - dev-dr-plan
  - dev-dr-apply
  - dev-primary-peering-plan
  - dev-primary-peering-apply
  - notify

variables:
  SECRET_DETECTION_ENABLED: 'true'
  STAGE_ROLE_ARN: arn:aws:iam::792014834907:role/gitlab-vaas-iac-role
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

include:
  - template: Security/Secret-Detection.gitlab-ci.yml

secret_detection:
  stage: secret-detection

.assume_aws_stage_role: &assume_aws_stage_role
  - |
    aws_sts_output=$(aws sts assume-role-with-web-identity \
      --role-arn ${STAGE_ROLE_ARN} \
      --role-session-name "GitLabRunner-${CI_PROJECT_ID}-${CI_PIPELINE_ID}" \
      --web-identity-token ${GITLAB_OIDC_TOKEN} \
      --duration-seconds 3600 \
      --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
      --output text)
    export $(printf "AWS_ACCESS_KEY_ID=%s AWS_SECRET_ACCESS_KEY=%s AWS_SESSION_TOKEN=%s" $aws_sts_output)
    echo "Assumed AWS role ${STAGE_ROLE_ARN}"
    aws sts get-caller-identity

.terraform_base:
  image: hashicorp/terraform:1.12.2
  variables:
    KUBERNETES_POD_LABELS_INTERNET_ALLOW: "internet=allow"
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.corp.zscaler.com
  before_script:
    - apk update
    - apk add --no-cache aws-cli bash git
    - *assume_aws_stage_role
    - cp ./environments/dev/backend.tf ./backend.tf
    - terraform version
    - terraform init
    - terraform validate

check-rebased:
  stage: validate
  image: alpine/git:latest
  script:
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        echo "On default branch, continuing pipeline"
        exit 0
      fi

      git fetch origin "$CI_DEFAULT_BRANCH"

      MERGE_BASE=$(git merge-base HEAD origin/"$CI_DEFAULT_BRANCH")
      MAIN_HEAD=$(git rev-parse origin/"$CI_DEFAULT_BRANCH")

      if [ "$MERGE_BASE" != "$MAIN_HEAD" ]; then
        echo "ERROR: Branch $CI_COMMIT_BRANCH is not rebased on $CI_DEFAULT_BRANCH!"
        echo "Please rebase your branch before pushing."
        exit 1
      else
        echo "Branch is properly rebased on $CI_DEFAULT_BRANCH, continuing pipeline"
      fi
  allow_failure: false

terraform-format-check:
  stage: terraform-format-check
  image: hashicorp/terraform:1.12.2
  script:
    - echo "Checking Terraform formatting..."
    - |
      if ! terraform fmt -check -recursive; then
        echo "The following files failed formatting:"
        terraform fmt -check -recursive
        exit 1
      fi
  allow_failure: false

terraform-scan:
  image: golang:latest
  stage: terraform-scan
  variables:
    KUBERNETES_POD_LABELS_INTERNET_ALLOW: "internet=allow"
  before_script:
    - go install github.com/aquasecurity/tfsec/cmd/tfsec@latest
  script:
    - tfsec .
  needs:
    - check-rebased
  allow_failure: false

dev-primary-bootstrap-plan:
  extends: .terraform_base
  stage: dev-primary-bootstrap-plan
  script:
    - echo "Planning DEV PRIMARY bootstrap with VPC peering disabled"
    - terraform plan -out=dev-primary-bootstrap.tfplan -var-file="./environments/dev/parameters.dev.primary.tfvars" -var="vpc_peering_enabled=false"
  needs:
    - terraform-scan
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  artifacts:
    paths:
      - dev-primary-bootstrap.tfplan

dev-primary-bootstrap-apply:
  extends: .terraform_base
  stage: dev-primary-bootstrap-apply
  script:
    - echo "Applying DEV PRIMARY bootstrap plan"
    - terraform apply -auto-approve dev-primary-bootstrap.tfplan
  needs:
    - job: dev-primary-bootstrap-plan
      artifacts: true
  dependencies:
    - dev-primary-bootstrap-plan
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  artifacts:
    paths:
      - status_dev_primary_bootstrap_apply.txt
  after_script:
    - echo "$CI_JOB_STATUS" > status_dev_primary_bootstrap_apply.txt

dev-dr-plan:
  extends: .terraform_base
  stage: dev-dr-plan
  script:
    - echo "Planning DEV DR deployment"
    - terraform plan -out=dev-dr.tfplan -var-file="./environments/dev/parameters.dev.dr.tfvars"
  needs:
    - dev-primary-bootstrap-apply
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  artifacts:
    paths:
      - dev-dr.tfplan

dev-dr-apply:
  extends: .terraform_base
  stage: dev-dr-apply
  script:
    - echo "Applying DEV DR plan"
    - terraform apply -auto-approve dev-dr.tfplan
  needs:
    - job: dev-dr-plan
      artifacts: true
  dependencies:
    - dev-dr-plan
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  artifacts:
    paths:
      - status_dev_dr_apply.txt
  after_script:
    - echo "$CI_JOB_STATUS" > status_dev_dr_apply.txt

dev-primary-peering-plan:
  extends: .terraform_base
  stage: dev-primary-peering-plan
  script:
    - echo "Planning DEV PRIMARY steady-state apply with peering enabled from tfvars"
    - terraform plan -out=dev-primary-peering.tfplan -var-file="./environments/dev/parameters.dev.primary.tfvars"
  needs:
    - dev-dr-apply
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  artifacts:
    paths:
      - dev-primary-peering.tfplan

dev-primary-peering-apply:
  extends: .terraform_base
  stage: dev-primary-peering-apply
  script:
    - echo "Applying DEV PRIMARY peering plan"
    - terraform apply -auto-approve dev-primary-peering.tfplan
  needs:
    - job: dev-primary-peering-plan
      artifacts: true
  dependencies:
    - dev-primary-peering-plan
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  artifacts:
    paths:
      - status_dev_primary_peering_apply.txt
  after_script:
    - echo "$CI_JOB_STATUS" > status_dev_primary_peering_apply.txt