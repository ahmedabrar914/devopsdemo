workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "api"'
    - when: never

stages: [status]

# Reuse your existing assume role pattern (update role ARN if needed)
variables:
  STAGE_ROLE_ARN: arn:aws:iam::792014834907:role/gitlab-vaas-iac-role

.assume_aws_role: &assume_aws_role
  - |
    aws_sts_output=$(aws sts assume-role-with-web-identity \
      --role-arn ${STAGE_ROLE_ARN} \
      --role-session-name "GitLabRunner-${CI_PROJECT_ID}-${CI_PIPELINE_ID}" \
      --web-identity-token ${GITLAB_OIDC_TOKEN} \
      --duration-seconds 3600 \
      --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
      --output text)
    export $(printf "AWS_ACCESS_KEY_ID=%s AWS_SECRET_ACCESS_KEY=%s AWS_SESSION_TOKEN=%s" $aws_sts_output)
    aws sts get-caller-identity

default:
  image: amazon/aws-cli:2.15.57
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.corp.zscaler.com
  before_script:
    - yum -y install jq >/dev/null 2>&1 || true
    - *assume_aws_role

.ssm_status:
  script:
    - |
      set -euo pipefail

      : "${TARGET_REGION:?missing TARGET_REGION}"
      : "${BASTION_INSTANCE_ID:?missing BASTION_INSTANCE_ID}"
      : "${VAULT_NODES:?missing VAULT_NODES}"
      : "${VAULT_SSH_USER:?missing VAULT_SSH_USER}"
      : "${VAULT_ADDR_LOCAL:?missing VAULT_ADDR_LOCAL}"

      REMOTE_SCRIPT="$(cat <<'EOF'
      set -euo pipefail

      VAULT_SSH_USER="__VAULT_SSH_USER__"
      VAULT_ADDR_LOCAL="__VAULT_ADDR_LOCAL__"
      VAULT_NODES="__VAULT_NODES__"

      read -r -a NODES <<< "${VAULT_NODES}"

      ssh_vault() {
        local host="$1"; shift
        ssh -o StrictHostKeyChecking=accept-new "${VAULT_SSH_USER}@${host}" "bash -lc $'set -euo pipefail\n$*'"
      }

      find_leader() {
        for n in "${NODES[@]}"; do
          standby="$(ssh_vault "$n" "export VAULT_ADDR='${VAULT_ADDR_LOCAL}'; vault status -format=json | jq -r .standby" || true)"
          [[ "$standby" == "false" ]] && { echo "$n"; return 0; }
        done
        return 1
      }

      leader="$(find_leader)"
      if [[ -z "${leader:-}" ]]; then
        echo "ERROR: Could not find leader. Nodes=${VAULT_NODES}" >&2
        exit 1
      fi

      echo "Leader: ${leader}"
      ssh_vault "$leader" "export VAULT_ADDR='${VAULT_ADDR_LOCAL}'; vault status -format=json | jq ."
      EOF
      )"

      REMOTE_SCRIPT="${REMOTE_SCRIPT//__VAULT_SSH_USER__/${VAULT_SSH_USER}}"
      REMOTE_SCRIPT="${REMOTE_SCRIPT//__VAULT_ADDR_LOCAL__/${VAULT_ADDR_LOCAL}}"
      REMOTE_SCRIPT="${REMOTE_SCRIPT//__VAULT_NODES__/${VAULT_NODES}}"

      CMD_B64="$(printf "%s" "${REMOTE_SCRIPT}" | base64 -w0)"

      command_id="$(aws ssm send-command \
        --region "${TARGET_REGION}" \
        --instance-ids "${BASTION_INSTANCE_ID}" \
        --document-name "AWS-RunShellScript" \
        --comment "Vault status leader" \
        --parameters commands="echo ${CMD_B64} | base64 -d | bash" \
        --query 'Command.CommandId' \
        --output text)"

      echo "SSM CommandId: ${command_id}"

      while true; do
        status="$(aws ssm get-command-invocation --region "${TARGET_REGION}" --command-id "${command_id}" --instance-id "${BASTION_INSTANCE_ID}" --query Status --output text)"
        echo "Status: ${status}"
        case "${status}" in
          Success)
            aws ssm get-command-invocation --region "${TARGET_REGION}" --command-id "${command_id}" --instance-id "${BASTION_INSTANCE_ID}" \
              --query StandardOutputContent --output text
            exit 0
            ;;
          Failed|Cancelled|TimedOut)
            aws ssm get-command-invocation --region "${TARGET_REGION}" --command-id "${command_id}" --instance-id "${BASTION_INSTANCE_ID}" --output json || true
            exit 1
            ;;
          *)
            sleep 5
            ;;
        esac
      done

status-usw2:
  stage: status
  extends: .ssm_status
  variables:
    TARGET_REGION: "us-west-2"
    BASTION_INSTANCE_ID: "i-REPLACE_WITH_USW2_BASTION_ID"
    VAULT_SSH_USER: "ec2-user"
    VAULT_ADDR_LOCAL: "https://127.0.0.1:8200"
    VAULT_NODES: "10.0.10.11 10.0.11.12 10.0.12.13"

status-use1:
  stage: status
  extends: .ssm_status
  variables:
    TARGET_REGION: "us-east-1"
    BASTION_INSTANCE_ID: "i-REPLACE_WITH_USE1_BASTION_ID"
    VAULT_SSH_USER: "ec2-user"
    VAULT_ADDR_LOCAL: "https://127.0.0.1:8200"
    VAULT_NODES: "10.1.10.11 10.1.11.12 10.1.12.13"