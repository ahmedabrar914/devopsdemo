workflow:
  rules:
    # run only when triggered manually (web) or via API
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "api"'
    - when: never

stages:
  - status

variables:
  # Use same role you already use for infra (example shown from your file)
  STAGE_ROLE_ARN: arn:aws:iam::792014834907:role/gitlab-vaas-iac-role

.assume_aws_role: &assume_aws_role
  - |
    aws_sts_output=$(aws sts assume-role-with-web-identity \
      --role-arn ${STAGE_ROLE_ARN} \
      --role-session-name "GitLabRunner-${CI_PROJECT_ID}-${CI_PIPELINE_ID}" \
      --web-identity-token ${GITLAB_OIDC_TOKEN} \
      --duration-seconds 3600 \
      --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
      --output text)
    export $(printf "AWS_ACCESS_KEY_ID=%s AWS_SECRET_ACCESS_KEY=%s AWS_SESSION_TOKEN=%s" $aws_sts_output)
    aws sts get-caller-identity

default:
  image: amazon/aws-cli:2.15.57
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.corp.zscaler.com
  before_script:
    - yum -y install jq >/dev/null 2>&1 || true
    - *assume_aws_role

.ssm_run:
  script:
    - |
      set -euo pipefail
      : "${TARGET_REGION:?}"
      : "${BASTION_INSTANCE_ID:?}"
      : "${VAULT_SSH_USER:?}"
      : "${VAULT_ADDR_LOCAL:?}"
      : "${VAULT_NODES:?}"

      REMOTE_SCRIPT="$(cat <<'EOF'
      set -euo pipefail

      VAULT_SSH_USER="__VAULT_SSH_USER__"
      VAULT_ADDR_LOCAL="__VAULT_ADDR_LOCAL__"
      VAULT_NODES="__VAULT_NODES__"

      read -r -a NODES <<< "${VAULT_NODES}"

      ssh_vault() {
        local host="$1"; shift
        ssh -o StrictHostKeyChecking=accept-new "${VAULT_SSH_USER}@${host}" "bash -lc $'set -euo pipefail\n$*'"
      }

      find_leader() {
        for n in "${NODES[@]}"; do
          # vault status does not require token
          standby="$(ssh_vault "$n" "export VAULT_ADDR='${VAULT_ADDR_LOCAL}'; vault status -format=json | jq -r .standby" || true)"
          if [[ "$standby" == "false" ]]; then
            echo "$n"
            return 0
          fi
        done
        return 1
      }

      leader="$(find_leader)"
      if [[ -z "${leader:-}" ]]; then
        echo "ERROR: Could not find leader from nodes: ${VAULT_NODES}" >&2
        exit 1
      fi

      echo "Leader: ${leader}"
      echo "vault status (leader):"
      ssh_vault "$leader" "export VAULT_ADDR='${VAULT_ADDR_LOCAL}'; vault status -format=json | jq ."
      EOF
      )"

      # inject vars
      REMOTE_SCRIPT="${REMOTE_SCRIPT//__VAULT_SSH_USER__/${VAULT_SSH_USER}}"
      REMOTE_SCRIPT="${REMOTE_SCRIPT//__VAULT_ADDR_LOCAL__/${VAULT_ADDR_LOCAL}}"
      REMOTE_SCRIPT="${REMOTE_SCRIPT//__VAULT_NODES__/${VAULT_NODES}}"

      COMMAND_B64="$(printf "%s" "${REMOTE_SCRIPT}" | base64 -w0)"

      command_id="$(aws ssm send-command \
        --region "${TARGET_REGION}" \
        --instance-ids "${BASTION_INSTANCE_ID}" \
        --document-name "AWS-RunShellScript" \
        --comment "Vault leader status" \
        --parameters commands="echo ${COMMAND_B64} | base64 -d | bash" \
        --query 'Command.CommandId' \
        --output text)"

      echo "SSM CommandId: ${command_id}"

      while true; do
        status="$(aws ssm get-command-invocation \
          --region "${TARGET_REGION}" \
          --command-id "${command_id}" \
          --instance-id "${BASTION_INSTANCE_ID}" \
          --query Status \
          --output text)"
        echo "Status: ${status}"
        case "${status}" in
          Success)
            aws ssm get-command-invocation \
              --region "${TARGET_REGION}" \
              --command-id "${command_id}" \
              --instance-id "${BASTION_INSTANCE_ID}" \
              --query StandardOutputContent \
              --output text
            exit 0
            ;;
          Failed|Cancelled|TimedOut)
            aws ssm get-command-invocation \
              --region "${TARGET_REGION}" \
              --command-id "${command_id}" \
              --instance-id "${BASTION_INSTANCE_ID}" \
              --output json || true
            exit 1
            ;;
          *)
            sleep 5
            ;;
        esac
      done

status-usw2:
  stage: status
  extends: .ssm_run
  variables:
    TARGET_REGION: "us-west-2"
    BASTION_INSTANCE_ID: "$USW2_BASTION_INSTANCE_ID"
    VAULT_NODES: "$PRIMARY_VAULT_NODES"

status-use1:
  stage: status
  extends: .ssm_run
  variables:
    TARGET_REGION: "us-east-1"
    BASTION_INSTANCE_ID: "$USE1_BASTION_INSTANCE_ID"
    VAULT_NODES: "$DR_VAULT_NODES"