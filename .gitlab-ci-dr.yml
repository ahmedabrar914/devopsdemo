workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "api"'
    - when: never

stages: [dr-status]

variables:
  # Staging only
  STAGE_ROLE_ARN: "arn:aws:iam::792014834907:role/gitlab-vaas-iac-role"

  # Make runner able to reach AWS endpoints (same as your tfsec job)
  KUBERNETES_POD_LABELS_INTERNET_ALLOW: "internet=allow"
  AWS_STS_REGIONAL_ENDPOINTS: "regional"

default:
  image: amazon/aws-cli:2.15.57
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.corp.zscaler.com
  before_script:
    - |
      set -euo pipefail
      yum -y install jq >/dev/null 2>&1 || true

      # Assume staging role using GitLab OIDC
      aws_sts_output=$(aws sts assume-role-with-web-identity \
        --role-arn "${STAGE_ROLE_ARN}" \
        --role-session-name "GitLabRunner-${CI_PROJECT_ID}-${CI_PIPELINE_ID}" \
        --web-identity-token "${GITLAB_OIDC_TOKEN}" \
        --duration-seconds 3600 \
        --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
        --output text)

      export AWS_ACCESS_KEY_ID="$(echo "$aws_sts_output" | awk '{print $1}')"
      export AWS_SECRET_ACCESS_KEY="$(echo "$aws_sts_output" | awk '{print $2}')"
      export AWS_SESSION_TOKEN="$(echo "$aws_sts_output" | awk '{print $3}')"

      aws sts get-caller-identity

.dr_status_job:
  stage: dr-status
  script:
    - |
      set -euo pipefail

      : "${TARGET_REGION:?missing TARGET_REGION}"
      : "${BASTION_INSTANCE_ID:?missing BASTION_INSTANCE_ID}"
      : "${VAULT_NODES:?missing VAULT_NODES}"
      : "${VAULT_SSH_USER:?missing VAULT_SSH_USER}"
      : "${SSH_KEY_PATH:?missing SSH_KEY_PATH}"
      : "${VAULT_ADDR_LOCAL:?missing VAULT_ADDR_LOCAL}"

      export AWS_REGION="${TARGET_REGION}"
      export AWS_DEFAULT_REGION="${TARGET_REGION}"

      echo "Creating remote script file..."
      cat > remote.sh <<'SCRIPT'
      set -euo pipefail

      : "${VAULT_SSH_USER:?}"
      : "${VAULT_ADDR_LOCAL:?}"
      : "${VAULT_NODES:?}"
      : "${SSH_KEY_PATH:?}"

      KNOWN_HOSTS_FILE="/tmp/known_hosts_vault"
      read -r -a NODES <<< "${VAULT_NODES}"

      ssh_vault() {
        local host="$1"; shift || true
        ssh-keygen -f "${KNOWN_HOSTS_FILE}" -R "${host}" >/dev/null 2>&1 || true
        ssh -i "${SSH_KEY_PATH}" \
          -o UserKnownHostsFile="${KNOWN_HOSTS_FILE}" \
          -o StrictHostKeyChecking=accept-new \
          -o LogLevel=ERROR \
          "${VAULT_SSH_USER}@${host}" \
          "bash -lc $'set -euo pipefail\n$*'"
      }

      find_leader() {
        for n in "${NODES[@]}"; do
          standby="$(ssh_vault "$n" "export VAULT_ADDR='${VAULT_ADDR_LOCAL}'; vault status -format=json | jq -r .standby" || true)"
          if [[ "$standby" == "false" ]]; then
            echo "$n"
            return 0
          fi
        done
        return 1
      }

      leader="$(find_leader || true)"
      if [[ -z "${leader:-}" ]]; then
        echo "ERROR: Could not find leader. Nodes=${VAULT_NODES}" >&2
        exit 1
      fi

      echo "Leader node: ${leader}"
      echo "---- vault status ----"
      ssh_vault "$leader" "export VAULT_ADDR='${VAULT_ADDR_LOCAL}'; vault status -format=json | jq ."

      echo "---- replication status ----"
      ssh_vault "$leader" "export VAULT_ADDR='${VAULT_ADDR_LOCAL}'; vault read -format=json sys/replication/status | jq .data"
      SCRIPT

      REMOTE_B64="$(base64 -w0 remote.sh)"

      echo "Sending SSM command to bastion ${BASTION_INSTANCE_ID} in ${TARGET_REGION}"
      command_id="$(aws ssm send-command \
        --region "${TARGET_REGION}" \
        --instance-ids "${BASTION_INSTANCE_ID}" \
        --document-name "AWS-RunShellScript" \
        --comment "Vault status + replication status (${TARGET_REGION})" \
        --parameters commands="export VAULT_SSH_USER='${VAULT_SSH_USER}' VAULT_ADDR_LOCAL='${VAULT_ADDR_LOCAL}' VAULT_NODES='${VAULT_NODES}' SSH_KEY_PATH='${SSH_KEY_PATH}'; echo ${REMOTE_B64} | base64 -d > /tmp/remote.sh; bash /tmp/remote.sh" \
        --query 'Command.CommandId' \
        --output text)"

      echo "SSM CommandId: ${command_id}"

      # Wait for completion
      while true; do
        status="$(aws ssm get-command-invocation \
          --region "${TARGET_REGION}" \
          --command-id "${command_id}" \
          --instance-id "${BASTION_INSTANCE_ID}" \
          --query Status --output text)"
        echo "SSM Status: ${status}"
        case "${status}" in
          Success)
            echo "===== OUTPUT (${TARGET_REGION}) ====="
            aws ssm get-command-invocation \
              --region "${TARGET_REGION}" \
              --command-id "${command_id}" \
              --instance-id "${BASTION_INSTANCE_ID}" \
              --query StandardOutputContent --output text
            exit 0
            ;;
          Failed|Cancelled|TimedOut)
            echo "===== ERROR (${TARGET_REGION}) ====="
            aws ssm get-command-invocation \
              --region "${TARGET_REGION}" \
              --command-id "${command_id}" \
              --instance-id "${BASTION_INSTANCE_ID}" \
              --output json || true
            exit 1
            ;;
          *)
            sleep 5
            ;;
        esac
      done

status-usw2:
  extends: .dr_status_job
  variables:
    TARGET_REGION: "us-west-2"
    BASTION_INSTANCE_ID: "REPLACE_USW2_BASTION_ID"
    VAULT_SSH_USER: "ubuntu"
    SSH_KEY_PATH: "/usr/bin/vaas-staging/vault-staging-ssh-key.pem"
    VAULT_ADDR_LOCAL: "https://127.0.0.1:8200"
    VAULT_NODES: "REPLACE_USW2_NODE1_IP REPLACE_USW2_NODE2_IP REPLACE_USW2_NODE3_IP"

status-use1:
  extends: .dr_status_job
  variables:
    TARGET_REGION: "us-east-1"
    BASTION_INSTANCE_ID: "REPLACE_USE1_BASTION_ID"
    VAULT_SSH_USER: "ubuntu"
    SSH_KEY_PATH: "/root/vaas-dev-dr/vault-dev-dr-ssh-key.pem"
    VAULT_ADDR_LOCAL: "https://127.0.0.1:8200"
    VAULT_NODES: "REPLACE_USE1_NODE1_IP REPLACE_USE1_NODE2_IP REPLACE_USE1_NODE3_IP"