# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/ee/user/application_security/sast/#customizing-the-sast-settings
# Secret Detection customization: https://docs.gitlab.com/user/application_security/secret_detection/pipeline/configure
# Dependency Scanning customization: https://docs.gitlab.com/ee/user/application_security/dependency_scanning/#customizing-the-dependency-scanning-settings
# Container Scanning customization: https://docs.gitlab.com/ee/user/application_security/container_scanning/#customizing-the-container-scanning-settings
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ee/ci/variables/#cicd-variable-precedence

spec:
  inputs:
    target_env:
      options: ['dev', 'nonprod', 'prod']
      default: 'dev'
      description: 'Select target environment'

    primary_region:
      options: ['us-west-2', 'us-east-1']
      default: 'us-west-2'
      description: 'Select primary region'

    run_mode:
      options: ['validate_only', 'execute']
      default: 'validate_only'
      description: 'Select execution mode'

    dr_action:
      options: ['', 'failover', 'failback']
      default: ''
      description: 'Select DR operation'

---

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never

default:
  retry:
    max: 2
    when:
      - script_failure
      - runner_system_failure
      - unknown_failure
      - scheduler_failure

stages:
- test
- secret-detection
- validate
- terraform-format-check
- terraform-scan
- plan
- apply
# - primary-plan
# - primary-apply
# - dr-plan
# - dr-apply
- failover
- failback
- notify

variables:
  SECRET_DETECTION_ENABLED: 'true'
  STAGE_ROLE_ARN: arn:aws:iam::792014834907:role/gitlab-vaas-iac-role
  PROD_ROLE_ARN: arn:aws:iam::100828516796:role/gitlab-vaas-iac-role

secret_detection:
  stage: secret-detection
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: never

include:
- template: Security/Secret-Detection.gitlab-ci.yml

# -----------------------------
# Change sets
# -----------------------------
.all_env_changes: &all_env_changes
  changes:
    - "*.tf"
    - "*.tf.json"
    - modules/**/*
    - shared/**/*

.dev_env_changes: &dev_env_changes
  changes:
    - environments/dev/**/*

.nonprod_env_changes: &nonprod_env_changes
  changes:
    - environments/nonprod/**/*

.prod_env_changes: &prod_env_changes
  changes:
    - environments/prod/**/*


# -----------------------------
# OIDC -> Assume Role (per-job)
# -----------------------------
.assume_aws_role: &assume_aws_role
  - |
    if [ -z "$AWS_ROLE_ARN" ]; then
      echo "ERROR: AWS_ROLE_ARN is not set for this job"
      exit 1
    fi

    aws_sts_output=$(aws sts assume-role-with-web-identity \
      --role-arn "${AWS_ROLE_ARN}" \
      --role-session-name "GitLabRunner-${CI_PROJECT_ID}-${CI_PIPELINE_ID}" \
      --web-identity-token "${GITLAB_OIDC_TOKEN}" \
      --duration-seconds 3600 \
      --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
      --output text)

    export $(printf "AWS_ACCESS_KEY_ID=%s AWS_SECRET_ACCESS_KEY=%s AWS_SESSION_TOKEN=%s" $aws_sts_output)
    aws sts get-caller-identity

.terraform_base:
  image: hashicorp/terraform:1.12.2
  variables:
    KUBERNETES_POD_LABELS_INTERNET_ALLOW: "internet=allow"
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.corp.zscaler.com
  before_script:
    - apk update
    - apk add --no-cache aws-cli bash
    - *assume_aws_role

# validate if the branch is rebased with main as terraform state might not be updated.
check-rebased:
  stage: validate
  image: alpine/git:latest
  script:
    - |
      # Skip for main branch
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        echo "On main branch, continuing pipeline"
        exit 0
      fi
      
      # Fetch main branch
      git fetch origin main
      
      # Check if current branch is rebased on main
      MERGE_BASE=$(git merge-base HEAD origin/main)
      MAIN_HEAD=$(git rev-parse origin/main)
      
      if [ "$MERGE_BASE" != "$MAIN_HEAD" ]; then
        echo "ERROR: Branch $CI_COMMIT_BRANCH is not rebased on main!"
        echo "Please rebase your branch before pushing."
        exit 1
      else
        echo "Branch is properly rebased on main, continuing pipeline"
      fi
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: never

terraform-format-check:
  stage: terraform-format-check
  image: hashicorp/terraform:1.12.2
  script:
    - echo "Checking Terraform formatting..."
    - if ! terraform fmt -check; then
      echo "The following files failed formatting:";
      terraform fmt -check;
      exit 1;
      fi
  allow_failure: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: never

terraform-scan:
  image: golang:latest
  stage: terraform-scan
  variables:
    KUBERNETES_POD_LABELS_INTERNET_ALLOW: "internet=allow"
  before_script:
    - go install github.com/aquasecurity/tfsec/cmd/tfsec@latest
  script:
    - tfsec .
  needs:
    - check-rebased
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: never

# -----------------------------
# Terraform plan/apply templates
# -----------------------------
.terraform_plan_template:
  extends: .terraform_base
  stage: plan
  script:
    - test -f "$ENV_DIR/backend.tf"
    - test -f "$TFVARS_FILE"
    - cp "$ENV_DIR/backend.tf" ./backend.tf
    - terraform init
    - terraform validate
    - echo "running terraform plan"
    - terraform plan -out="tfplan-${CI_JOB_NAME}.tfplan" -var-file="$TFVARS_FILE"
  artifacts:
    when: always
    paths:
      - "tfplan-${CI_JOB_NAME}.tfplan"
      - "status_${CI_JOB_NAME}.txt"
    expire_in: 1 day
  after_script:
    - echo "$CI_JOB_STATUS" > "status_${CI_JOB_NAME}.txt"

.terraform_apply_template:
  extends: .terraform_base
  stage: apply
  script:
    - test -f "$ENV_DIR/backend.tf"
    - test -f "$TFVARS_FILE"
    - cp "$ENV_DIR/backend.tf" ./backend.tf
    - terraform init
    - echo "running terraform apply"
    - terraform apply -auto-approve -var-file="$TFVARS_FILE"
  artifacts:
    when: always
    paths:
      - "status_${CI_JOB_NAME}.txt"
    expire_in: 1 day
  after_script:
    - echo "$CI_JOB_STATUS" > "status_${CI_JOB_NAME}.txt"

# -----------------------------
# DEV (uses STAGE_ROLE_ARN)
# -----------------------------
# =========================================================
# DEV - PLAN (split per region)
# =========================================================

dev_plan_usw2:
  extends: .terraform_plan_template
  variables:
    AWS_ROLE_ARN: "$STAGE_ROLE_ARN"
    ENV_DIR: "environments/dev/primary/us-west-2"
    TFVARS_FILE: "environments/dev/primary/us-west-2/parameters.primary.tfvars"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - environments/dev/primary/us-west-2/**/*
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      <<: *all_env_changes
    - when: never

dev_plan_use1:
  extends: .terraform_plan_template
  variables:
    AWS_ROLE_ARN: "$STAGE_ROLE_ARN"
    ENV_DIR: "environments/dev/dr/us-east-1"
    TFVARS_FILE: "environments/dev/dr/us-east-1/parameters.dr.tfvars"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - environments/dev/dr/us-east-1/**/*
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      <<: *all_env_changes
    - when: never



# -----------------------------
# NONPROD (uses PROD_ROLE_ARN as per your requirement)
# -----------------------------
nonprod_plan_usw2:
  extends: .terraform_plan_template
  variables:
    AWS_ROLE_ARN: "$PROD_ROLE_ARN"
    ENV_DIR: "environments/nonprod/us-west-2"
    TFVARS_FILE: "environments/nonprod/us-west-2/parameters.usw2-nonprod.tfvars"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - environments/nonprod/us-west-2/**/*
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      <<: *all_env_changes
    - when: never

nonprod_plan_use1:
  extends: .terraform_plan_template
  variables:
    AWS_ROLE_ARN: "$PROD_ROLE_ARN"
    ENV_DIR: "environments/nonprod/us-east-1"
    TFVARS_FILE: "environments/nonprod/us-east-1/parameters.dr.tfvars"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - environments/nonprod/us-east-1/**/*
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      <<: *all_env_changes
    - when: never

