workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never

default:
  retry:
    max: 2
    when:
      - script_failure
      - runner_system_failure
      - unknown_failure
      - scheduler_failure

stages:
- test
- secret-detection
- validate
- terraform-format-check
- terraform-scan
- primary-plan
- primary-apply
- failover
- failback
- notify

variables:
  SECRET_DETECTION_ENABLED: 'true'
  STAGE_ROLE_ARN: arn:aws:iam::792014834907:role/gitlab-vaas-iac-role


secret_detection:
  stage: secret-detection
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: never
include:
- template: Security/Secret-Detection.gitlab-ci.yml


# - component: "$CI_SERVER_FQDN/zscaler-components-library/send-notification/slack-notification@main"


.assume_aws_stage_role: &assume_aws_stage_role
  - |
    aws_sts_output=$(aws sts assume-role-with-web-identity \
      --role-arn ${STAGE_ROLE_ARN} \
      --role-session-name "GitLabRunner-${CI_PROJECT_ID}-${CI_PIPELINE_ID}" \
      --web-identity-token ${GITLAB_OIDC_TOKEN} \
      --duration-seconds 3600 \
      --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
      --output text)
    export $(printf "AWS_ACCESS_KEY_ID=%s AWS_SECRET_ACCESS_KEY=%s AWS_SESSION_TOKEN=%s" $aws_sts_output)
    echo "Assumed AWS role ${STAGE_ROLE_ARN}"
    aws sts get-caller-identity

.terraform_base:
  image: hashicorp/terraform:1.12.2
  variables:
    KUBERNETES_POD_LABELS_INTERNET_ALLOW: "internet=allow"
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.corp.zscaler.com
  before_script:
    - apk update
    - apk add --no-cache aws-cli bash
    - *assume_aws_stage_role

# validate if the branch is rebased with main as terraform state might not be updated.
check-rebased:
  stage: validate
  image: alpine/git:latest
  script:
    - |
      # Skip for main branch
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        echo "On main branch, continuing pipeline"
        exit 0
      fi
      
      # Fetch main branch
      git fetch origin main
      
      # Check if current branch is rebased on main
      MERGE_BASE=$(git merge-base HEAD origin/main)
      MAIN_HEAD=$(git rev-parse origin/main)
      
      if [ "$MERGE_BASE" != "$MAIN_HEAD" ]; then
        echo "ERROR: Branch $CI_COMMIT_BRANCH is not rebased on main!"
        echo "Please rebase your branch before pushing."
        exit 1
      else
        echo "Branch is properly rebased on main, continuing pipeline"
      fi
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: never

terraform-format-check:
  stage: terraform-format-check
  image: hashicorp/terraform:1.12.2
  script:
    - echo "Checking Terraform formatting..."
    - if ! terraform fmt -check; then
      echo "The following files failed formatting:";
      terraform fmt -check;
      exit 1;
      fi
  allow_failure: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: never

terraform-scan:
  image: golang:latest
  stage: terraform-scan
  variables:
    KUBERNETES_POD_LABELS_INTERNET_ALLOW: "internet=allow"
  before_script:
    - go install github.com/aquasecurity/tfsec/cmd/tfsec@latest
  script:
    - tfsec .
  needs:
    - check-rebased
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: never


primary-plan:
  extends: .terraform_base
  stage: primary-plan
  script:
    - cp ./environments/dev/primary/us-west-2/backend.tf ./backend.tf
    - terraform init
    - terraform validate
    - echo "Planning DEV PRIMARY bootstrap with VPC peering disabled"
    - terraform plan -out=dev-primary.tfplan -var-file="./environments/dev/primary/us-west-2/parameters.primary.tfvars"
  needs:
    - terraform-scan
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: never
  artifacts:
    paths:
      - dev-primary.tfplan

primary-apply:
  extends: .terraform_base
  stage: primary-apply
  script:
    - cp ./environments/dev/primary/us-west-2/backend.tf ./backend.tf
    - terraform init
    - echo "Applying DEV PRIMARY bootstrap plan"
    - terraform apply -auto-approve -var-file="./environments/dev/primary/us-west-2/parameters.primary.tfvars"
  needs:
    - job: primary-plan
      artifacts: true
  dependencies:
    - primary-plan
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: never
  artifacts:
    paths:
      - status_dev_primary_bootstrap_apply.txt
  after_script:
    - echo "$CI_JOB_STATUS" > status_dev_primary_bootstrap_apply.txt
